<main class="min-h-screen bg-gray-50">
  <div class="mx-auto max-w-7xl px-6 py-10">
    <div class="mb-8">
      <p class="text-sm font-semibold uppercase tracking-wider text-orange-500">
        La Guarida
      </p>
      <h1 class="mt-1 text-3xl font-bold text-gray-900">
        Catálogo de repuestos
      </h1>
    </div>
    <div class="grid gap-6 lg:grid-cols-[240px_1fr]">
      <!-- FILTROS -->
      <aside class="h-fit rounded-xl border border-gray-200 bg-white p-5">
        <h2 class="font-bold text-gray-900">
          Filtros
        </h2>
        <label class="mt-6 block text-sm font-medium text-gray-700">
          Categoría
        </label>
        <p-select
          [(ngModel)]="categoria"
          (onChange)="filtrar()"
          [options]="categoriasOpciones"
          optionLabel="label"
          optionValue="value"
          placeholder="Todas las categorías"
          styleClass="mt-2 w-full"/>
        <label class="mt-4 block text-sm font-medium text-gray-700">Marca</label>
        <p-select 
          [(ngModel)]="marca" 
          (onChange)="filtrar()" 
          [options]="marcasOpciones" 
          optionLabel="label" 
          optionValue="value" 
          styleClass="mt-2 w-full" />
        <label class="mt-4 block text-sm font-medium text-gray-700">Disponibilidad</label>
        <p-select 
          [(ngModel)]="disponibilidad" 
          (onChange)="filtrar()" 
          [options]="disponibilidadOpciones" 
          optionLabel="label" 
          optionValue="value" 
          styleClass="mt-2 w-full" />
        <button
          (click)="categoria = ''; marca = ''; disponibilidad = ''; busqueda = ''; filtrar()"
          pButton type="button" 
          label="Limpiar filtros" 
          icon="pi pi-filter-slash" 
          severity="secondary" 
          [outlined]="true"
          class="mt-4 w-full">
        </button>
      </aside>
      <!-- PRODUCTOS -->
      <section>
        <div class="mb-6">
          <input
            pInputText
            type="text"
            [(ngModel)]="busqueda"
            (input)="filtrar()"
            placeholder="Buscar por nombre, código o marca..."
            class="w-full"/>
        </div>
        <div
          *ngIf="productosFiltrados.length === 0"
          class="rounded-xl bg-white p-10 text-center">
          <p class="text-gray-500">
            No encontramos productos con esos criterios.
          </p>
        </div>
        <div class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3">
          <article
            *ngFor="let producto of productosFiltrados"
            class="overflow-hidden rounded-xl border border-gray-200 bg-white transition hover:-translate-y-1 hover:shadow-lg">
            <div class="flex h-40 items-center justify-center bg-gray-100">
              <img
                [src]="producto.imagen"
                [alt]="producto.nombre"
                (error)="usarImagenAlternativa($event)"
                class="h-full w-full object-cover"/>
            </div>
            <div class="p-5">
              <span class="text-xs text-gray-400">
                {{ producto.codigo }}
              </span>
              <h3 class="mt-1 font-bold text-gray-900">
                {{ producto.nombre }}
              </h3>
              <p class="mt-1 text-sm text-gray-500">
                {{ producto.marca }}
              </p>
              <p class="mt-1 text-xs text-gray-500" *ngIf="producto.modeloCompatible">Compatible: {{ producto.modeloCompatible }}</p>
              <p class="mt-3 text-lg font-bold text-gray-900">
                S/ {{ producto.precio.toFixed(2) }}
              </p>
              <p class="mt-1 text-xs text-gray-400">
                Stock disponible: {{ producto.stock }}
              </p>
              <button
                (click)="agregar(producto)"
                pButton type="button" 
                label="Añadir al carrito" 
                icon="pi pi-shopping-cart"
                class="mt-4 w-full cursor-pointer">
              </button>
            </div>
          </article>
        </div>
      </section>
    </div>
  </div>
</main>
