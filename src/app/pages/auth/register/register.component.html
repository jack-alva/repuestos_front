<div
  class="flex min-h-screen items-center justify-center bg-gray-100 px-6 py-10"
>

  <div
    class="w-full max-w-lg rounded-2xl bg-white p-8 shadow-xl"
  >

    <a
      routerLink="/home"
      class="text-sm text-gray-500 hover:text-orange-500"
    >
      ← Volver al inicio
    </a>

    <h1 class="mt-8 text-3xl font-bold text-gray-900">
      Crear cuenta
    </h1>

    <p class="mt-2 text-gray-500">
      Regístrate como cliente de La Guarida.
    </p>


    <form
      (ngSubmit)="registrar()"
      class="mt-8 space-y-5"
    >

      <div class="grid gap-5 sm:grid-cols-2">

        <div>

          <label
            class="mb-2 block text-sm font-medium"
          >
            Nombre
          </label>

          <input
            name="nombre"
            [(ngModel)]="nombre"
            required
            class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-orange-500"
          />

        </div>


        <div>

          <label
            class="mb-2 block text-sm font-medium"
          >
            Apellido
          </label>

          <input
            name="apellido"
            [(ngModel)]="apellido"
            required
            class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-orange-500"
          />

        </div>

      </div>


      <div>

        <label
          class="mb-2 block text-sm font-medium"
        >
          Correo electrónico
        </label>

        <input
          type="email"
          name="correo"
          [(ngModel)]="correo"
          required
          class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-orange-500"
        />

      </div>


      <div>

        <label
          class="mb-2 block text-sm font-medium"
        >
          Contraseña
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-orange-500"
        />

      </div>


      <div
        *ngIf="error"
        class="rounded-lg bg-red-50 p-3 text-sm text-red-600"
      >
        {{ error }}
      </div>


      <button
        type="submit"
        class="w-full rounded-lg bg-orange-500 py-3 font-semibold text-white hover:bg-orange-600"
      >
        Crear cuenta
      </button>

    </form>


    <p class="mt-6 text-center text-sm text-gray-500">

      ¿Ya tienes una cuenta?

      <a
        routerLink="/login"
        class="font-semibold text-orange-500"
      >
        Inicia sesión
      </a>

    </p>

  </div>

</div>
