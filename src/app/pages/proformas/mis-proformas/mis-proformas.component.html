<main class="min-h-screen bg-gray-50">

  <div class="mx-auto max-w-5xl px-6 py-10">

    <h1 class="text-3xl font-bold text-gray-900">
      Mis proformas
    </h1>

    <p class="mt-2 text-gray-500">
      Consulta las proformas que has generado.
    </p>


    <div
      *ngIf="proformas.length === 0"
      class="mt-8 rounded-xl bg-white p-10 text-center"
    >

      <p class="text-gray-500">
        Todavía no has generado ninguna proforma.
      </p>

      <a
        routerLink="/catalogo"
        class="mt-5 inline-block rounded-lg bg-orange-500 px-6 py-3 font-semibold text-white"
      >
        Ir al catálogo
      </a>

    </div>


    <div
      *ngIf="proformas.length > 0"
      class="mt-8 space-y-4"
    >

      <article
        *ngFor="let proforma of proformas"
        class="rounded-xl bg-white p-6 shadow-sm"
      >

        <div
          class="flex flex-wrap items-center justify-between gap-4"
        >

          <div>

            <p class="text-xs text-gray-400">
              Código
            </p>

            <h2
              class="text-xl font-bold text-orange-500"
            >
              {{ proforma.codigo }}
            </h2>

            <p class="mt-1 text-sm text-gray-500">
              {{ proforma.fecha | date:'dd/MM/yyyy HH:mm' }}
            </p>

          </div>


          <div class="text-right">

            <span
              class="rounded-full bg-yellow-100 px-3 py-1 text-xs font-semibold text-yellow-700"
            >
              {{ proforma.estado }}
            </span>

            <p class="mt-2 font-bold">
              S/ {{ proforma.total.toFixed(2) }}
            </p>

          </div>

        </div>

      </article>

    </div>

  </div>

</main>
