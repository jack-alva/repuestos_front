<main class="min-h-screen bg-gray-50">

  <div class="mx-auto max-w-7xl px-6 py-10">

    <h1 class="text-3xl font-bold">
      Proformas
    </h1>

    <p class="mt-2 text-gray-500">
      Proformas generadas por los clientes.
    </p>


    <div
      *ngIf="proformas.length === 0"
      class="mt-8 rounded-xl bg-white p-10 text-center"
    >

      <p class="text-gray-500">
        No existen proformas registradas todavía.
      </p>

    </div>


    <div
      *ngIf="proformas.length > 0"
      class="mt-8 overflow-hidden rounded-xl bg-white shadow-sm"
    >

      <app-crud-table [value]="proformas" dataKey="codigo" emptyMessage="No existen proformas registradas.">
        <ng-template #header><tr class="bg-orange-50 text-left text-sm text-gray-600"><th class="px-6 py-4">Código</th><th class="px-6 py-4">Fecha</th><th class="px-6 py-4">Estado</th><th class="px-6 py-4">Total</th></tr></ng-template>
        <ng-template #body let-proforma><tr class="border-b border-gray-100"><td class="px-6 py-4 font-semibold text-orange-500">{{ proforma.codigo }}</td><td class="px-6 py-4">{{ proforma.fecha | date:'dd/MM/yyyy HH:mm' }}</td><td class="px-6 py-4"><span class="rounded-full bg-orange-50 px-3 py-1 text-sm font-medium text-orange-700">{{ proforma.estado }}</span></td><td class="px-6 py-4 font-semibold">S/ {{ proforma.total.toFixed(2) }}</td></tr></ng-template>
      </app-crud-table>

    </div>

  </div>

</main>
