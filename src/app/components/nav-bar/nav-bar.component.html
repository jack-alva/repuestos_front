<nav class="sticky top-0 z-50 border-b border-orange-600 bg-orange-500 text-white shadow-sm">

  <div class="mx-auto flex h-20 max-w-7xl items-center gap-6 px-6">
    <a
      [routerLink]="rutaPrincipal()"
      class="flex min-w-fit items-center gap-2">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-white text-xl text-orange-500">
        <i class="pi pi-cog" aria-hidden="true"></i>
      </div>
      <span class="text-xl font-bold text-white">
        La Guarida de los Repuestos
      </span>
    </a>
    <div *ngIf="mostrarBuscador" class="hidden flex-1 md:block"><app-search-bar /></div>

    <a
      routerLink="/carrito"
      *ngIf="authService.obtenerRol() === 'CLIENTE'"
      class="relative ml-auto flex items-center gap-2 rounded-lg px-3 py-2 text-white transition hover:bg-orange-600">
      <i class="pi pi-shopping-cart text-xl" aria-hidden="true"></i>
      <div class="hidden text-right sm:block">
        <p class="text-xs text-orange-100">
          Carrito
        </p>
        <p class="font-semibold text-white">
          S/ {{ totalCarrito.toFixed(2) }}
        </p>
      </div>
      <span
        *ngIf="cantidadCarrito > 0"
        class="absolute -right-1 -top-1 flex h-5 w-5 items-center justify-center rounded-full bg-orange-500 text-xs font-bold text-white">
        {{ cantidadCarrito }}
      </span>
    </a>
    <a
      *ngIf="!authService.estaAutenticado()"
      routerLink="/login"
      class="ml-auto rounded-lg bg-white px-5 py-2.5 text-sm font-semibold text-orange-600 transition hover:bg-orange-50"
    >
      Iniciar sesión
    </a>
    <div *ngIf="authService.estaAutenticado()"
      class="flex items-center gap-3">
      <a [routerLink]="rutaPanel()" class="hidden text-right text-white transition hover:text-orange-100 md:block">
        <p class="text-sm font-semibold text-white">
          {{ authService.obtenerUsuario()?.nombre }}
        </p>
        <p class="text-xs text-orange-100">
          {{ authService.obtenerRol() }}
        </p>
      </a>
      <button
        (click)="logout()"
        pButton type="button" 
        label="Salir" 
        icon="pi pi-sign-out" 
        severity="secondary" 
        [outlined]="true"
        class="!border-white !bg-white !text-orange-600 hover:!bg-orange-50">
      </button>
    </div>
  </div>
</nav>
