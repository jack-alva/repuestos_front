<p-table
  [value]="value"
  [dataKey]="dataKey"
  [paginator]="paginator && value.length > rows"
  [rows]="rows"
  [stripedRows]="true"
  [showGridlines]="true"
  responsiveLayout="scroll"
  styleClass="p-datatable-sm crud-table"
  [tableStyle]="{ 'min-width': '42rem' }"
>
  <ng-template pTemplate="header">
    <ng-container *ngTemplateOutlet="headerTemplate"></ng-container>
  </ng-template>

  <ng-template pTemplate="body" let-rowData>
    <ng-container *ngTemplateOutlet="bodyTemplate; context: { $implicit: rowData }"></ng-container>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="20" class="px-6 py-10 text-center text-sm text-gray-500">
        <i class="pi pi-inbox mr-2 text-orange-500" aria-hidden="true"></i>{{ emptyMessage }}
      </td>
    </tr>
  </ng-template>
</p-table>
